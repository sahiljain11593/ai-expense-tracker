name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (Tesseract for OCR tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check (all modules)
        run: |
          python -m py_compile transaction_web_app.py \
            data_store.py \
            ml_engine.py \
            insights_engine.py \
            dashboard.py \
            mobile_ui.py \
            auth_ui.py \
            drive_backup.py
          echo "All modules compile OK"

      - name: Run pytest
        run: python -m pytest -v --tb=short
        env:
          # Prevent Streamlit from prompting for telemetry consent
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
